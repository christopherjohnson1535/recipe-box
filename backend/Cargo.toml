[package]
name = "recipe-box-api"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = [".", "crates/adapters/anthropic", "crates/adapters/http-fetch", "crates/adapters/html", "crates/domain", "crates/ports", "crates/adapters/memory", "crates/adapters/fs-media", "crates/adapters/postgres", "crates/app", "crates/adapters/http"]
default-members = [".", "crates/adapters/anthropic", "crates/adapters/http-fetch", "crates/adapters/html", "crates/domain", "crates/ports", "crates/adapters/memory", "crates/adapters/fs-media", "crates/adapters/postgres", "crates/app", "crates/adapters/http"]

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["postgres", "uuid", "chrono", "json", "migrate", "macros", "runtime-tokio", "tls-rustls"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dependencies]
recipe-box-app = { path = "crates/app" }
recipe-box-domain = { path = "crates/domain" }
recipe-box-adapter-http = { path = "crates/adapters/http" }
recipe-box-adapter-postgres = { path = "crates/adapters/postgres" }
recipe-box-adapter-anthropic = { path = "crates/adapters/anthropic" }
recipe-box-adapter-http-fetch = { path = "crates/adapters/http-fetch" }
recipe-box-adapter-html = { path = "crates/adapters/html" }
recipe-box-adapter-fs-media = { path = "crates/adapters/fs-media" }
recipe-box-ports = { path = "crates/ports" }
anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23"
chrono = { workspace = true, features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rand = "0.10"
sha2 = "0.11"
sqlx.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
serde_json = "1"
url.workspace = true
futures-util = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[[bench]]
name = "search"
harness = false
