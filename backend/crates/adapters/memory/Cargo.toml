[package]
name = "recipe-box-adapter-memory"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "adapter_memory"

[dependencies]
async-trait = "0.1"
chrono.workspace = true
recipe-box-domain = { path = "../../domain" }
recipe-box-ports = { path = "../../ports" }
uuid.workspace = true

[dev-dependencies]
recipe-box-ports = { path = "../../ports", features = ["contract"] }
tokio = { version = "1", features = ["macros", "rt"] }
