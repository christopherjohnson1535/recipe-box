[package]
name = "recipe-box-adapter-google"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "adapter_google"

# Outbound Google adapter (docs/adr/0008): OAuth and the Tasks API behind `ports::GoogleTasks`.
[dependencies]
async-trait = "0.1"
base64 = "0.23"
# `aws_lc_rs` only: it is the crypto rustls already uses; `rust_crypto` would add the `rsa` crate (RUSTSEC-2023-0071).
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
recipe-box-domain = { path = "../../domain" }
recipe-box-ports = { path = "../../ports" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
