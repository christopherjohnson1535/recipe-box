[package]
name = "recipe-box-adapter-google"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "adapter_google"

# Outbound Google adapter (docs/adr/0008): OAuth and the Tasks API behind `ports::GoogleTasks`.
[dependencies]
async-trait = "0.1"
recipe-box-domain = { path = "../../domain" }
recipe-box-ports = { path = "../../ports" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { workspace = true }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
