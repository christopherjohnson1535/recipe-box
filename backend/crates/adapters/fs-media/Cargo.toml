[package]
name = "recipe-box-adapter-fs-media"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "adapter_fs_media"

[dependencies]
async-trait = "0.1"
recipe-box-domain = { path = "../../domain" }
recipe-box-ports = { path = "../../ports" }
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
recipe-box-ports = { path = "../../ports", features = ["contract"] }
tokio = { version = "1", features = ["macros", "rt"] }
