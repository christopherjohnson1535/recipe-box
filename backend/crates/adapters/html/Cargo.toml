[package]
name = "recipe-box-adapter-html"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "adapter_html"

# Page parsing adapter (docs/adr/0008): JSON-LD, microdata and readable text behind `ports::PageReader`.
[dependencies]
async-trait = "0.1"
recipe-box-domain = { path = "../../domain" }
recipe-box-ports = { path = "../../ports" }
scraper = "0.29.0"
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
url.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
