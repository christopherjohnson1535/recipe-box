[package]
name = "recipe-box-adapter-http"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "adapter_http"

# The inbound HTTP adapter (docs/adr/0008): axum routes, extractors, error mapping and the API types. It reaches the
# application only through `app` services; no storage, image or crypto crates belong here.
[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = "0.18" # already pulled in by axum-extra; needed for its re-exported `time::Duration` (Max-Age)
chrono = { workspace = true, features = ["serde"] }
recipe-box-app = { path = "../../app" }
recipe-box-domain = { path = "../../domain" }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
utoipa = { version = "6", features = ["chrono", "uuid"] }
uuid = { workspace = true, features = ["serde"] }
