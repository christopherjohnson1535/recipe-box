name: Bug
description: Something doesn't work
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: where
    attributes:
      label: Device / browser / host
      description: e.g. iPad Safari 18.5 home-screen app, Docker on Windows
