name: API contract

# Own workflow so that adding or removing the `breaking-api` label re-runs only this check, not all of CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    # The API spec (docs/openapi.json) and the frontend types and Python client generated from it must match the code, and a PR
    # may not break the API unless it carries the `breaking-api` label.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main is the base of the breaking-change check
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x # oasdiff v1.34.1 declares go 1.26.0
          cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Regenerate the spec, the frontend types and the Python client
        run: |
          cargo run --manifest-path backend/Cargo.toml --bin openapi > docs/openapi.json
          npm ci --prefix frontend
          npm run --prefix frontend api:types
          # Keep this command in step with `just sdk-python`.
          uvx --from openapi-python-client==0.29.1 --with ruff==0.17.2 openapi-python-client generate --path docs/openapi.json --config sdks/python/config.yml --output-path sdks/python/recipe-box-client --meta uv --overwrite
          rm -rf sdks/python/recipe-box-client/.ruff_cache
          (cd sdks/python/tests && uv lock)
      - name: Fail on drift
        run: git diff --exit-code -- docs/openapi.json frontend/src/lib/api-types.ts sdks/python
      - name: Lint the spec
        run: npx --yes @redocly/cli@2.71.0 lint docs/openapi.json
      - name: Fail on breaking changes
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'breaking-api')
        run: |
          # First-PR case: main has no spec yet, so there is nothing to break.
          if ! git show origin/main:docs/openapi.json > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            echo "origin/main has no docs/openapi.json yet; skipping the breaking-change check"
            exit 0
          fi
          GOBIN="$RUNNER_TEMP/bin" go install github.com/oasdiff/oasdiff@v1.34.1
          "$RUNNER_TEMP/bin/oasdiff" breaking --fail-on ERR "$RUNNER_TEMP/base.json" docs/openapi.json
