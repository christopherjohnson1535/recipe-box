name: PR title

# Squash-merge uses the PR title as the commit message, so it must be a Conventional Commit:
#   feat(frontend): add cook-mode timers (#13)
# No secrets needed; the job only reads the title from the event payload.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const title = process.env.PR_TITLE;
            const types = ['feat', 'fix', 'docs', 'style', 'refactor', 'perf', 'test', 'build', 'ci', 'chore', 'revert'];
            const re = new RegExp(`^(${types.join('|')})(\\([a-z0-9][a-z0-9-]*\\))?!?: \\S.*$`);
            if (!re.test(title)) {
              core.setFailed(
                `PR title "${title}" is not a Conventional Commit.\n` +
                `Expected: <type>(<optional scope>): <summary>, where type is one of ${types.join(', ')}.\n` +
                `Example: feat(frontend): add cook-mode timers (#13)`
              );
            }
