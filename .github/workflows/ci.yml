name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run on main (Mon 05:17 UTC) to catch rot: new advisories, toolchain and base-image changes.
    - cron: "17 5 * * 1"

# Least privilege: nothing by default; each job below grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; let every main push finish publishing its images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install libheif (HEIC tests need heif-convert)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Domain, ports, app and HTTP adapter crates keep their dependency layering
        run: |
          set -euo pipefail
          for crate in recipe-box-domain recipe-box-ports recipe-box-app; do
            # A failing `cargo tree` (typo'd crate name) must fail the step, not pass the guard.
            cargo tree -p "$crate" -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
            if grep -E '^(axum|sqlx|reqwest|tokio|utoipa|hyper)( |$)' "$RUNNER_TEMP/tree.txt"; then
              echo "::error::$crate depends on infrastructure"
              exit 1
            fi
          done
          # The app crate also stays free of the image, crypto and encoding crates its ports hide.
          cargo tree -p recipe-box-app -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
          if grep -E '^(image|argon2|rand|sha2|base64)( |$)' "$RUNNER_TEMP/tree.txt"; then
            echo "::error::recipe-box-app depends on an image or crypto crate"
            exit 1
          fi
          # The HTTP adapter reaches storage, images, crypto and the server crate only through `app`.
          cargo tree -p recipe-box-adapter-http -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
          if grep -E '^(sqlx|reqwest|image|argon2|recipe-box-api)( |$)' "$RUNNER_TEMP/tree.txt"; then
            echo "::error::recipe-box-adapter-http depends on a storage, image, crypto or server crate"
            exit 1
          fi
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest
      # Run 1: nextest, one process per test, so no test can lean on another's in-process state. No retries.
      - run: cargo nextest run --profile ci
      # Run 2: libtest in a random order. nextest has no shuffle option, and RUSTC_BOOTSTRAP lets stable
      # use libtest's --shuffle-seed. The seed is printed first: replay a failure with the same SEED.
      - name: Shuffled order (libtest)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          SEED="$(date +%s)"
          echo "shuffle seed: $SEED (replay: cargo test -- -Zunstable-options --shuffle-seed $SEED)"
          cargo test -- -Zunstable-options --shuffle-seed "$SEED"

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: 1.59.0
      - run: just install-frontend
      - run: just check-frontend

  coverage:
    # Reports coverage for both stacks and fails if a number drops (see coverage-baseline.json).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install libheif (HEIC tests need heif-convert)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npx vitest run --coverage
      - name: Backend coverage
        working-directory: backend
        run: |
          cargo llvm-cov --workspace --html --output-dir coverage
          cargo llvm-cov report --json --summary-only --output-path coverage-summary.json
      - name: Ratchet and summary
        # bash with pipefail: a ratchet failure must fail the job even though its output is piped into tee.
        shell: bash
        run: node scripts/coverage-ratchet.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-html
          path: |
            frontend/coverage
            backend/coverage
          if-no-files-found: ignore

  compose:
    # Proves the containers build and the stack comes up healthy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: API healthy through the web port
        run: curl -fsS http://127.0.0.1:3000/api/health | grep -q '"db":"ok"'
      - name: Login page renders (a fresh stack redirects to /setup)
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = 200
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  e2e:
    # End-to-end suite (e2e/): the real containers from docker-compose.e2e.yml, driven through the API and a browser at
    # desktop, iPad and phone sizes. No retries; a failure uploads the HTML report and traces.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    env:
      CI: "true"
      E2E_STACK: compose
      E2E_KEEP_STACK: "1" # the job tears the stack down itself, after printing logs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Boot the stack
        run: docker compose -f ../docker-compose.e2e.yml up -d --build --wait --wait-timeout 300
      - name: Run the suite (api + web projects, then the restart check)
        run: npm test
      - if: failure()
        run: docker compose -f ../docker-compose.e2e.yml logs --no-color
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - if: always()
        run: docker compose -f ../docker-compose.e2e.yml down -v

  images:
    # Multi-arch images (OPS-3): built on every run so a PR proves arm64 still builds; pushed to GHCR only on main
    # and version tags. The API cross-compiles for arm64 (see backend/Dockerfile), so no QEMU emulation of rustc.
    runs-on: ubuntu-latest
    needs: [compose]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/recipe-box-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
