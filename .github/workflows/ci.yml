name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run on main (Mon 05:17 UTC) to catch rot: new advisories, toolchain and base-image changes.
    - cron: "17 5 * * 1"

# Least privilege: nothing by default; each job below grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; let every main push finish publishing its images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install libheif (HEIC tests need heif-convert)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Domain, ports, app and HTTP adapter crates keep their dependency layering
        run: |
          set -euo pipefail
          for crate in recipe-box-domain recipe-box-ports recipe-box-app; do
            # A failing `cargo tree` (typo'd crate name) must fail the step, not pass the guard.
            cargo tree -p "$crate" -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
            if grep -E '^(axum|sqlx|reqwest|tokio|utoipa|hyper)( |$)' "$RUNNER_TEMP/tree.txt"; then
              echo "::error::$crate depends on infrastructure"
              exit 1
            fi
          done
          # The app crate also stays free of the image, crypto and encoding crates its ports hide.
          cargo tree -p recipe-box-app -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
          if grep -E '^(image|argon2|rand|sha2|base64)( |$)' "$RUNNER_TEMP/tree.txt"; then
            echo "::error::recipe-box-app depends on an image or crypto crate"
            exit 1
          fi
          # The HTTP adapter reaches storage, images, crypto and the server crate only through `app`.
          cargo tree -p recipe-box-adapter-http -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
          if grep -E '^(sqlx|reqwest|image|argon2|recipe-box-api)( |$)' "$RUNNER_TEMP/tree.txt"; then
            echo "::error::recipe-box-adapter-http depends on a storage, image, crypto or server crate"
            exit 1
          fi
      - name: Outbound network stays in three adapters, and the outbound adapters stay leaf crates
        run: |
          set -euo pipefail
          # Only the SSRF-guarded fetcher, the Anthropic and Google clients and the server crate (which wires them) may have
          # reqwest in their normal dependency tree; the server crate must not list it as a direct dependency.
          cargo tree -i reqwest -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
          if grep -vE '^(reqwest|recipe-box-adapter-(anthropic|google|http-fetch)|recipe-box-api)( |$)' "$RUNNER_TEMP/tree.txt"; then
            echo "::error::a crate other than the http-fetch, anthropic and google adapters depends on reqwest"
            exit 1
          fi
          cargo tree -p recipe-box-api -e normal --depth 1 --prefix none > "$RUNNER_TEMP/tree.txt"
          if grep -E '^reqwest( |$)' "$RUNNER_TEMP/tree.txt"; then
            echo "::error::recipe-box-api depends on reqwest directly"
            exit 1
          fi
          # The outbound adapters reach the rest of the application only through domain and ports.
          for crate in recipe-box-adapter-anthropic recipe-box-adapter-google recipe-box-adapter-http-fetch recipe-box-adapter-html; do
            cargo tree -p "$crate" -e normal --prefix none > "$RUNNER_TEMP/tree.txt"
            if grep -vE "^$crate " "$RUNNER_TEMP/tree.txt" | grep -E '^(recipe-box-app|recipe-box-api|recipe-box-adapter-[a-z-]+|axum|sqlx)( |$)'; then
              echo "::error::$crate depends on the app, the server, another adapter or a storage/web crate"
              exit 1
            fi
          done
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-nextest
      # Run 1: nextest, one process per test, so no test can lean on another's in-process state. No retries.
      - run: cargo nextest run --profile ci
      # Run 2: libtest in a random order. nextest has no shuffle option, and RUSTC_BOOTSTRAP lets stable
      # use libtest's --shuffle-seed. The seed is printed first: replay a failure with the same SEED.
      - name: Shuffled order (libtest)
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          SEED="$(date +%s)"
          echo "shuffle seed: $SEED (replay: cargo test -- -Zunstable-options --shuffle-seed $SEED)"
          cargo test -- -Zunstable-options --shuffle-seed "$SEED"

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.59.0
      - run: just install-frontend
      - run: just check-frontend

  shellcheck:
    # Lint for the shell scripts (backup and restore handle your data, so they get a linter). The release binary is pinned
    # by version and its SHA-256 is checked before it runs; nothing here can write to the repo or use a secret.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/shellcheck"
      - name: Lint every tracked shell script
        run: git ls-files -z '*.sh' | xargs -0 "$RUNNER_TEMP/shellcheck" -x --source-path=SCRIPTDIR

  coverage:
    # Reports coverage for both stacks and fails if a number drops (see coverage-baseline.json).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install libheif (HEIC tests need heif-convert)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libheif-examples libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Frontend coverage
        working-directory: frontend
        run: |
          npm ci
          npx vitest run --coverage
      - name: Backend coverage
        working-directory: backend
        run: |
          cargo llvm-cov --workspace --html --output-dir coverage
          # --workspace: count every crate, as the HTML report does (the root package alone shrinks as code moves
          # into crates/, which would read as a coverage drop).
          cargo llvm-cov report --workspace --json --summary-only --output-path coverage-summary.json
      - name: Ratchet and summary
        # bash with pipefail: a ratchet failure must fail the job even though its output is piped into tee.
        shell: bash
        run: node scripts/coverage-ratchet.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-html
          path: |
            frontend/coverage
            backend/coverage
          if-no-files-found: ignore

  compose:
    # Proves the containers build and the stack comes up healthy.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: API healthy through the web port
        run: curl -fsS http://127.0.0.1:3000/api/health | grep -q '"db":"ok"'
      - name: Login page renders (a fresh stack redirects to /setup)
        run: test "$(curl -fsSL -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = 200
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  e2e:
    # End-to-end suite (e2e/): the real containers from docker-compose.e2e.yml, driven through the API and a browser at
    # desktop, iPad and phone sizes. No retries; a failure uploads the HTML report and traces.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    env:
      CI: "true"
      E2E_STACK: compose
      E2E_KEEP_STACK: "1" # the job tears the stack down itself, after printing logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Boot the stack
        run: docker compose -f ../docker-compose.e2e.yml up -d --build --wait --wait-timeout 300
      - name: Run the suite (api + web projects, then the restart check)
        run: npm test
      - if: failure()
        run: docker compose -f ../docker-compose.e2e.yml logs --no-color
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - if: always()
        run: docker compose -f ../docker-compose.e2e.yml down -v

  backup:
    # Backup and restore (OPS-6, issue #19): scripts/backup.sh and scripts/restore.sh against a throwaway Compose stack of
    # their own (docker-compose.backup-e2e.yml: db + api, real volumes). e2e/tests/backup seeds recipes and photos, backs
    # up, wipes the volumes, restores and compares everything. No retries; a failure uploads the report.
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    env:
      CI: "true"
      E2E_STACK: compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Back up, wipe, restore (the test builds and starts the stack itself)
        run: npm run test:backup
      - if: failure()
        run: docker compose -f ../docker-compose.backup-e2e.yml logs --no-color
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-report
          path: |
            e2e/playwright-report/backup/
            e2e/test-results/backup/
          retention-days: 14
      - if: always()
        run: docker compose -f ../docker-compose.backup-e2e.yml down --volumes --remove-orphans

  sdk-python:
    # The generated Python client (sdks/python) against the real stack: login, create, search, delete (docs/SDK.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: docker compose -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 300
      - name: Run the smoke test
        working-directory: sdks/python/tests
        env:
          RECIPE_BOX_URL: http://127.0.0.1:3146
        run: uv run --locked pytest -q
      - if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  images:
    # Multi-arch images (OPS-3): built on every run so a PR proves arm64 still builds; pushed to GHCR only on main
    # and version tags. The API cross-compiles for arm64 (see backend/Dockerfile), so no QEMU emulation of rustc.
    # Waits for the compose, e2e and backup jobs so a version tag only ever publishes images that passed the full suite.
    runs-on: ubuntu-latest
    needs: [compose, e2e, backup]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/recipe-box-${{ matrix.name }}
          # latest comes only from the explicit main rule below; a v* tag must not move it.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Both platforms published
        if: github.event_name == 'push'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/recipe-box-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt

  release:
    # Version tags only (docs/DEPLOY.md "Cutting a release"): checks that both images pull without credentials on
    # both platforms, then creates the GitHub release with notes generated from merged PRs (.github/release.yml).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on main; release tags must point at a commit merged to main."
            exit 1
          fi
      - name: Images pull anonymously (amd64 + arm64)
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          # This job never logs in to GHCR, so a private package fails here: make both packages public first.
          for name in api web; do
            for arch in amd64 arm64; do
              docker pull --quiet --platform "linux/$arch" "ghcr.io/$OWNER/recipe-box-$name:$TAG"
            done
          done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Re-running the job for a tag that already has a release must not fail.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          # A tag with a suffix (v0.2.0-rc.1) is a prerelease: marked as such and never shown as "Latest".
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" $pre
