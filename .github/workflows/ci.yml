name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; let every main push finish publishing its images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  compose:
    # Proves the containers build and the stack comes up healthy.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 300
      - name: Login page renders
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = 200
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  e2e:
    # End-to-end suite (e2e/): the real containers from docker-compose.e2e.yml, driven through the API and a browser at
    # desktop, iPad and phone sizes. No retries; a failure uploads the HTML report and traces.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: e2e
    env:
      CI: "true"
      E2E_STACK: compose
      E2E_KEEP_STACK: "1" # the job tears the stack down itself, after printing logs
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Boot the stack
        run: docker compose -f ../docker-compose.e2e.yml up -d --build --wait --wait-timeout 300
      - name: Run the suite (api + web projects, then the restart check)
        run: npm test
      - if: failure()
        run: docker compose -f ../docker-compose.e2e.yml logs --no-color
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
      - if: always()
        run: docker compose -f ../docker-compose.e2e.yml down -v

  images:
    # Multi-arch images (OPS-3): built on every run so a PR proves arm64 still builds; pushed to GHCR only on main
    # and version tags. The API cross-compiles for arm64 (see backend/Dockerfile), so no QEMU emulation of rustc.
    runs-on: ubuntu-latest
    needs: [compose]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/recipe-box-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
