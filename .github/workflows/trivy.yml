name: Image scan

# Builds both images for the runner's architecture (loaded locally, never pushed) and scans them with Trivy.
# Fixable HIGH/CRITICAL vulnerabilities fail the job. The scheduled run catches CVEs published after the build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * 1"

permissions: {}

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: recipe-box-${{ matrix.name }}:scan
          cache-from: type=gha,scope=trivy-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=trivy-${{ matrix.name }}
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: recipe-box-${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          format: table
