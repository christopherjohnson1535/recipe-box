name: Image scan

# Builds both images for the runner's architecture (loaded locally, never pushed) and scans them with Trivy.
# Reporting only: fixable HIGH/CRITICAL findings go to the Security tab (SARIF) and never fail the run, because the base
# images are floating tags and an unrelated PR must not turn red when a new CVE appears. The scheduled run catches CVEs
# published after the build. Fork PRs have a read-only token, so they skip the upload.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "11 5 * * 1"

permissions: {}

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: recipe-box-${{ matrix.name }}:scan
          cache-from: type=gha,scope=trivy-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=trivy-${{ matrix.name }}
      # The vulnerability DBs come from registries that now and then answer with an error or rate limit; this made the
      # step fail on unchanged code, api and web alike. Try three registries, then run the whole scan once more.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        id: scan
        continue-on-error: true
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          image-ref: recipe-box-${{ matrix.name }}:scan
          # v0.33.1 installed Trivy v0.65.0 by default and failed before writing any SARIF; pin a current release.
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ steps.scan.outcome == 'failure' }}
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db:1,public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          image-ref: recipe-box-${{ matrix.name }}:scan
          # v0.33.1 installed Trivy v0.65.0 by default and failed before writing any SARIF; pin a current release.
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: ${{ !cancelled() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
