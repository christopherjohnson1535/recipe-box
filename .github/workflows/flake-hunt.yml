name: Flake hunt

on:
  workflow_dispatch:
  schedule:
    # Weekly (Mon 06:17 UTC): the backend suite 20 times in a row, plus the FND-2 search benchmark.
    - cron: "17 6 * * 1"

permissions: {}

jobs:
  repeat:
    # 20 consecutive green runs of the backend suite. No retries; stops at the first failure.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes_test
      # No ANSI escapes: the failing-test grep below anchors on the start of nextest's FAIL lines.
      CARGO_TERM_COLOR: never
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: backend
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest
      - name: Build once
        run: cargo nextest run --profile ci --no-run
      - name: Run the suite 20 times
        shell: bash
        run: |
          passed=0
          for i in $(seq 1 20); do
            echo "::group::run $i of 20"
            if cargo nextest run --profile ci 2>&1 | tee "run-$i.log"; then
              passed=$((passed + 1))
              echo "::endgroup::"
            else
              echo "::endgroup::"
              break
            fi
          done
          {
            echo "## Flake hunt"
            echo "$passed of 20 runs passed."
            if [ "$passed" -lt 20 ]; then
              echo "Failing tests in run $((passed + 1)):"
              echo '```'
              grep -E '^\s+(FAIL|SIGABRT|TIMEOUT)' "run-$((passed + 1)).log" | sort -u || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$passed" -eq 20 ]

  bench:
    # FND-2: search over 2,000 recipes under 300 ms. Separate from the correctness suite; fails only if the median is over.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: recipes
          POSTGRES_DB: recipes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recipes"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://recipes:recipes@localhost:5432/recipes_test
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: backend
      - name: Search benchmark
        shell: bash
        run: |
          set -o pipefail
          status=0
          cargo bench --bench search 2>&1 | tee bench.txt || status=$?
          { echo "## Search benchmark (FND-2)"; echo '```'; grep -E '^(FND-2|q=|FAIL)' bench.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
