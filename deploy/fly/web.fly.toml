# Recipe Box web app on Fly.io. Public HTTPS: https://<app>.fly.dev
#   fly deploy -c deploy/fly/web.fly.toml
# Replace both CHANGEME names: this app's, and the api app's in API_INTERNAL_URL. See docs/wiki/Deploy-Fly.md.

app = "recipe-box-web-CHANGEME"
primary_region = "iad"

[build]
  # `latest` is the newest build of main. Once a release exists, pin to a release tag such as v0.1.0
  # (docs/DEPLOY.md, "Common steps" tag table), and use the same tag as the api app.
  image = "ghcr.io/christopherjohnson1535/recipe-box-web:latest"

[env]
  API_INTERNAL_URL = "http://recipe-box-api-CHANGEME.internal:8080"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine running so the first request after a quiet spell is not slow.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/login"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
