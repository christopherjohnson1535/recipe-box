extends:
  - recommended
rules:
  # New routes must keep a stable operationId: SDK generators name methods after it.
  operation-operationId: error
  # health, getSetupStatus and logout have no client error to describe.
  operation-4xx-response: off
  # operation-2xx-response stays on; the two Google redirect routes (302 only, by design) are exempted one by one in
  # .redocly.lint-ignore.yaml.
apis:
  main:
    root: docs/openapi.json
